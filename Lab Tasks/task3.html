<!DOCTYPE html>
<html>
<head>
    <title>Tech Fest 2026</title>
</head>

<body>

<header>
    <h1>Tech Fest 2026 - Registration</h1>
    <p>Dept. of Computer Science & Engineering, BAUET</p>
</header>

<hr>

<main>

<form>

<fieldset>
<legend>Personal Information</legend>

<label for="name">Full Name:</label><br>
<input type="text" id="name" value="Afia Muajjm" required>

<br><br>

<label for="email">Institutional Email:</label><br>
<input type="email" id="email" value="afiamuazzama@94gmail.com" required>

<br><br>

<label for="phone">Phone Number (11 digits):</label><br>
<input type="tel" id="phone" value="01884063036"
       pattern="[0-9]{11}" required>

<br><br>

<label for="id">Student ID (9 digits):</label><br>
<input type="text" id="id" value="105101021"
       pattern="[0-9]{9}" required>

</fieldset>

<br>

<fieldset>
<legend>Event Registration</legend>

<label>Participant Category:</label><br>

<input type="radio" id="undergraduate" name="category">
<label for="undergraduate">Undergraduate</label>

<input type="radio" id="postgrad" name="category">
<label for="postgrad">Postgrad</label>

<input type="radio" id="faculty" name="category">
<label for="faculty">Faculty</label>

<br><br>

<label>Events:</label><br>

<input type="checkbox" id="hackathon">
<label for="hackathon">Hackathon</label>

<input type="checkbox" id="poster">
<label for="poster">Poster</label>

<input type="checkbox" id="gaming">
<label for="gaming">Gaming</label>

<input type="checkbox" id="robo">
<label for="robo">Robo</label>

<br><br>

<label for="shirt">T-Shirt Size:</label><br>

<select id="shirt">
    <option>Select Size</option>
    <option>S</option>
    <option>M</option>
    <option>L</option>
    <option>XL</option>
    <option>XXL</option>
</select>

<br><br>

<label for="receipt">Payment Receipt:</label><br>
<input type="file" id="receipt" accept=".pdf,.png">

<br><br>

<label for="notes">Special Notes:</label><br>
<textarea id="notes" rows="4" cols="30"></textarea>

</fieldset>

<br>

<input type="submit" value="Submit">
<input type="reset" value="Reset">

</form>

</main>

<hr>

<footer>
    <p>Tech Fest 2026 - BAUET</p>
</footer>

</body>
</html>
